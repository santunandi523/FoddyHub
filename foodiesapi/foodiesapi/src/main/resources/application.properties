spring.application.name=foodiesapi

#mongoDb configuration

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/foodsResturant}
spring.data.mongodb.database=foodsResturant

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#aws s3 configurations
aws.access.key=${AWS_ACCESS_KEY:dummy_aws_key}
aws.secret.key=${AWS_SECRET_KEY:dummy_aws_secret}
aws.region=ap-south-1
aws.s3.bucketname=foodyhub-foods
jwt.secret.key=${JWT_SECRET:oqRVIkPvZNZ6SBfsihQKrzzs/M0PBI156gBCYNrRjJY=}

# razorpay-configuration
razorpay-key=${RAZORPAY_API_KEY:dummy_razorpay_key}
razorpay-secret=${RAZORPAY_SECRET_KEY:dummy_razorpay_secret}

# cors allowed origins (comma-separated)
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179,http://localhost:5180,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5176,http://127.0.0.1:5177,http://127.0.0.1:5178}

# AI Assistant & LLM Configuration
ai.provider=${AI_PROVIDER:gemini}
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}